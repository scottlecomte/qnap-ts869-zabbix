    - uuid: 61a655bb23424498876bf32e80666b92
      name: 'HDD8: Health'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.24681.1.3.11.1.7.8]
      key: qnap.disk.health[8]
      delay: 2m
      value_type: CHAR
      tags:
      - tag: component
        value: disk
      - tag: disk
        value: HDD8
      triggers:
      - uuid: 4792e0fd03a74bab955ee21d7f398bee
        expression: last(/QNAP TS-869 Pro by SNMP/qnap.disk.health[8])<>"GOOD" and last(/QNAP TS-869 Pro by SNMP/qnap.disk.health[8])<>"--"
        name: 'QNAP: HDD8 health is not GOOD'
        event_name: 'QNAP: HDD8 health is {ITEM.LASTVALUE}'
        priority: HIGH
        description: The QNAP-reported disk health is neither GOOD nor the -- placeholder used for an empty bay.
    - uuid: e409bfb9e5774b678d976ebdd1376ba0
      name: 'HDD8: Temperature'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.24681.1.3.11.1.3.8]
      key: qnap.disk.temp[8]
      delay: 2m
      value_type: UNSIGNED
      units: °C
      tags:
      - tag: component
        value: temperature
      - tag: disk
        value: HDD8
      triggers:
      - uuid: c08b90cc2e684207b66c17cac69091fa
        expression: last(/QNAP TS-869 Pro by SNMP/qnap.disk.temp[8])>={$QNAP.DISK.TEMP.WARN} and last(/QNAP TS-869 Pro by
          SNMP/qnap.disk.temp[8])>0
        name: 'QNAP: HDD8 temperature is high'
        event_name: 'QNAP: HDD8 temperature is {ITEM.LASTVALUE}'
        priority: WARNING
        description: Disk temperature exceeds the configured warning threshold. A value of 0 is ignored so an empty bay does
          not alert.
    - uuid: fd749ed2ca5f4030bbfa94a0423e6e0c
      name: 'System fan 1: Speed'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.24681.1.3.15.1.3.1]
      key: qnap.fan.rpm[1]
      delay: 2m
      value_type: UNSIGNED
      units: RPM
      tags:
      - tag: component
        value: fan
      - tag: fan
        value: '1'
      triggers:
      - uuid: 1ed0fd1992e248a8a0466fb39b05c5d2
        expression: max(/QNAP TS-869 Pro by SNMP/qnap.fan.rpm[1],5m)=0
        name: 'QNAP: System fan 1 is stopped'
        priority: HIGH
    - uuid: d840af9d68f649c8b14ae0a12302f9f9
      name: 'System fan 2: Speed'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.24681.1.3.15.1.3.2]
      key: qnap.fan.rpm[2]
      delay: 2m
      value_type: UNSIGNED
      units: RPM
      tags:
      - tag: component
        value: fan
      - tag: fan
        value: '2'
      triggers:
      - uuid: e2cb1f2632714bfbaa91056c4470b811
        expression: max(/QNAP TS-869 Pro by SNMP/qnap.fan.rpm[2],5m)=0
        name: 'QNAP: System fan 2 is stopped'
        priority: HIGH
    - uuid: abeceb9b9e084db3bb66e5a29bc26917
      name: 'DataVol1: Total space'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.24681.1.3.17.1.4.1]
      key: qnap.volume.total[1]
      delay: 5m
      value_type: UNSIGNED
      units: B
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '1024'
      tags:
      - tag: component
        value: storage
      - tag: volume
        value: DataVol1
    - uuid: 546fc8f0439f465db17f47d8730cea43
      name: 'DataVol1: Free space'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.24681.1.3.17.1.5.1]
      key: qnap.volume.free[1]
      delay: 5m
      value_type: UNSIGNED
      units: B
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '1024'
      tags:
      - tag: component
        value: storage
      - tag: volume
        value: DataVol1
    - uuid: cddc3ea76cbc4ba5b1701febe7bba9ac
      name: 'DataVol1: Status'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.24681.1.3.17.1.6.1]
      key: qnap.volume.status[1]
      delay: 2m
      value_type: CHAR
      tags:
      - tag: component
        value: storage
      - tag: volume
        value: DataVol1
      triggers:
      - uuid: 7c9089293deb4786b271ad82e9c756e7
        expression: last(/QNAP TS-869 Pro by SNMP/qnap.volume.status[1])<>"Ready"
        name: 'QNAP: DataVol1 is not Ready'
        event_name: 'QNAP: DataVol1 status is {ITEM.LASTVALUE}'
        priority: HIGH
    - uuid: cc0281c304f14dcb99e1e67c9e440937
      name: 'DataVol1: Space utilization'
      type: CALCULATED
      key: qnap.volume.util[1]
      delay: 5m
      value_type: FLOAT
      units: '%'
      params: 100*(1-last(//qnap.volume.free[1])/last(//qnap.volume.total[1]))
      tags:
      - tag: component
        value: storage
      - tag: volume
        value: DataVol1
      triggers:
      - uuid: 9a058043302446438b6cae32e008421c
        expression: last(/QNAP TS-869 Pro by SNMP/qnap.volume.util[1])>={$QNAP.VOLUME.USED.WARN}
        name: 'QNAP: DataVol1 space utilization is high'
        event_name: 'QNAP: DataVol1 is {ITEM.LASTVALUE} full'
        priority: WARNING
    - uuid: 3705347991f449639d4dbe4ad6b95193
      name: 'CPU core 1: Utilization'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.25.3.3.1.2.768]
      key: qnap.cpu.core.util[1]
      delay: 1m
      history: 30d
      trends: 365d
      value_type: UNSIGNED
      units: '%'
      tags:
      - tag: component
        value: cpu
    - uuid: 8a4755b4b7a74d7f94dda2f077267968
      name: 'CPU core 2: Utilization'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.25.3.3.1.2.769]
      key: qnap.cpu.core.util[2]
      delay: 1m
      history: 30d
      trends: 365d
      value_type: UNSIGNED
      units: '%'
      tags:
      - tag: component
        value: cpu
    - uuid: 81b925da872f4efc8d31bae9dca1aabd
      name: 'CPU core 3: Utilization'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.25.3.3.1.2.770]
      key: qnap.cpu.core.util[3]
      delay: 1m
      history: 30d
      trends: 365d
      value_type: UNSIGNED
      units: '%'
      tags:
      - tag: component
        value: cpu
    - uuid: a015c93cad9a418f83b17a06e440585a
      name: 'CPU core 4: Utilization'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.25.3.3.1.2.771]
      key: qnap.cpu.core.util[4]
      delay: 1m
      history: 30d
      trends: 365d
      value_type: UNSIGNED
      units: '%'
      tags:
      - tag: component
        value: cpu
    - uuid: 74bb49d15f18438e8057762d26775119
      name: 'CPU: Average utilization'
      type: CALCULATED
      key: qnap.cpu.util.avg
      delay: 1m
      history: 30d
      trends: 365d
      value_type: FLOAT
      units: '%'
      params: (last(//qnap.cpu.core.util[1])+last(//qnap.cpu.core.util[2])+last(//qnap.cpu.core.util[3])+last(//qnap.cpu.core.util[4]))/4
      tags:
      - tag: component
        value: cpu
      triggers:
      - uuid: 743a86343f0d448b8697a1f3efb2cab2
        expression: avg(/QNAP TS-869 Pro by SNMP/qnap.cpu.util.avg,10m)>={$QNAP.CPU.UTIL.WARN}
        name: 'QNAP: CPU utilization is high'
        event_name: 'QNAP: CPU average utilization is {ITEM.LASTVALUE}'
        priority: WARNING
        description: Average CPU utilization has exceeded the configured threshold for 10 minutes.
    - uuid: ad3e07afbfd241509abef2ad9f1025c3
      name: 'Physical memory: Total'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.25.2.3.1.5.1]
      key: qnap.mem.total
      delay: 1m
      history: 30d
      trends: 365d
      value_type: UNSIGNED
      units: B
      preprocessing:
      - type: MULTIPLIER
        parameters:
