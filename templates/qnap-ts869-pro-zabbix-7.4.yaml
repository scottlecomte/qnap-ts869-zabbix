      tags:
      - tag: component
        value: memory
    - uuid: 4f9367d8301b4f28901b0f07813b02a7
      name: 'Physical memory: Used (raw)'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.25.2.3.1.6.1]
      key: qnap.mem.used.raw
      delay: 1m
      history: 30d
      trends: 365d
      value_type: UNSIGNED
      units: B
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '1024'
      tags:
      - tag: component
        value: memory
    - uuid: e534636aee314bb58fdab128459944c7
      name: Memory buffers
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.25.2.3.1.6.6]
      key: qnap.mem.buffers
      delay: 1m
      history: 30d
      trends: 365d
      value_type: UNSIGNED
      units: B
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '1024'
      tags:
      - tag: component
        value: memory
    - uuid: 8c01116a734a405593994ea36b941ab8
      name: Cached memory
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.25.2.3.1.6.7]
      key: qnap.mem.cached
      delay: 1m
      history: 30d
      trends: 365d
      value_type: UNSIGNED
      units: B
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '1024'
      tags:
      - tag: component
        value: memory
    - uuid: 3b3891ea6e404c17bc211a2762bd6b78
      name: 'Physical memory: Used'
      type: CALCULATED
      key: qnap.mem.used
      delay: 1m
      history: 30d
      trends: 365d
      value_type: UNSIGNED
      units: B
      params: last(//qnap.mem.used.raw)-last(//qnap.mem.buffers)-last(//qnap.mem.cached)
      tags:
      - tag: component
        value: memory
    - uuid: ea7249aea552487cb68bb180718de2fb
      name: 'Physical memory: Available'
      type: CALCULATED
      key: qnap.mem.available
      delay: 1m
      history: 30d
      trends: 365d
      value_type: UNSIGNED
      units: B
      params: last(//qnap.mem.total)-last(//qnap.mem.used)
      tags:
      - tag: component
        value: memory
    - uuid: 17f963456d1849d1bd5deca0a78507a7
      name: 'Physical memory: Utilization'
      type: CALCULATED
      key: qnap.mem.util
      delay: 1m
      history: 30d
      trends: 365d
      value_type: FLOAT
      units: '%'
      params: 100*last(//qnap.mem.used)/last(//qnap.mem.total)
      tags:
      - tag: component
        value: memory
      triggers:
      - uuid: d01a7077ad0f4de18d99645dbc24d4c6
        expression: avg(/QNAP TS-869 Pro by SNMP/qnap.mem.util,10m)>={$QNAP.MEM.UTIL.WARN}
        name: 'QNAP: Memory utilization is high'
        event_name: 'QNAP: Effective memory utilization is {ITEM.LASTVALUE}'
        priority: WARNING
        description: Effective memory utilization excludes memory reported by QTS as buffers and cache.
    tags:
    - tag: class
      value: storage
    - tag: target
      value: qnap
    macros:
    - macro: '{$SNMP_COMMUNITY}'
      type: SECRET_TEXT
      value: CHANGE_ME
      description: SNMPv2c community configured on the NAS. Change this value or override it at host level.
    - macro: '{$QNAP.DISK.TEMP.WARN}'
      value: '50'
      description: Disk temperature warning threshold in degrees Celsius.
    - macro: '{$QNAP.VOLUME.USED.WARN}'
      value: '90'
      description: Volume utilization warning threshold in percent.
    - macro: '{$QNAP.CPU.UTIL.WARN}'
      value: '90'
      description: Average CPU utilization warning threshold in percent.
    - macro: '{$QNAP.MEM.UTIL.WARN}'
      value: '90'
      description: Effective physical memory utilization warning threshold in percent.
