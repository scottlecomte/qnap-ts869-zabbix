zabbix_export:
  version: '7.4'
  template_groups:
  - uuid: bdeaa14c531245709ba6535a8d0ab845
    name: Templates/Storage
  templates:
  - uuid: 5d557a2e9413402ba58e5daa87e3c5f4
    template: QNAP TS-869 Pro by SNMP
    name: QNAP TS-869 Pro by SNMP
    description: 'Community SNMP template for QNAP TS-869 Pro running legacy QTS 4.3.x.

      Tested with QTS 4.3.4 and Zabbix 7.4.13 using SNMPv2c.

      Monitors all eight drive bays, disk temperature/health/model/capacity, two system fans, DataVol1, SNMP availability,
      four logical CPU processors via HOST-RESOURCES-MIB, and physical memory.

      Effective memory usage subtracts QTS-reported buffers and cached memory from raw used RAM.


      Configure the host with an SNMP interface on UDP/161. Set {$SNMP_COMMUNITY} to the SNMP community configured on the
      NAS.'
    vendor:
      name: Custom
      version: 7.4-2
    groups:
    - name: Templates/Storage
    items:
    - uuid: 37e4990cf4f14586a86d3ecbd14a99d0
      name: System description
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.1.0]
      key: qnap.system.descr
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: system
    - uuid: 96314351e37140dd9f5b8af111698e13
      name: SNMP agent availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      value_type: UNSIGNED
      tags:
      - tag: component
        value: system
      triggers:
      - uuid: 66cf46ec32e847f6b1856314b579e999
        expression: max(/QNAP TS-869 Pro by SNMP/zabbix[host,snmp,available],5m)=0
        name: 'QNAP: SNMP is unavailable'
        priority: HIGH
        description: Zabbix cannot reach the QNAP SNMP interface.
    - uuid: bb6247932b9d48dca6347a7df1463e68
      name: 'HDD1: Model'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.24681.1.3.11.1.5.1]
      key: qnap.disk.model[1]
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: disk
      - tag: disk
        value: HDD1
    - uuid: d45c8a48748b412da5fa51812ea63bca
      name: 'HDD1: Capacity'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.24681.1.3.11.1.6.1]
      key: qnap.disk.capacity[1]
      delay: 1h
      value_type: UNSIGNED
      units: B
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: disk
      - tag: disk
        value: HDD1
    - uuid: cdb787903dc14da5b1331cd609d28273
      name: 'HDD1: Health'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.24681.1.3.11.1.7.1]
      key: qnap.disk.health[1]
      delay: 2m
      value_type: CHAR
      tags:
      - tag: component
        value: disk
      - tag: disk
        value: HDD1
      triggers:
      - uuid: bf497a56fa4e4315b0b4b53b66694d9f
        expression: last(/QNAP TS-869 Pro by SNMP/qnap.disk.health[1])<>"GOOD" and last(/QNAP TS-869 Pro by SNMP/qnap.disk.health[1])<>"--"
        name: 'QNAP: HDD1 health is not GOOD'
        event_name: 'QNAP: HDD1 health is {ITEM.LASTVALUE}'
        priority: HIGH
        description: The QNAP-reported disk health is neither GOOD nor the -- placeholder used for an empty bay.
    - uuid: de23dece5315430bbd75a127291849e8
      name: 'HDD1: Temperature'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.24681.1.3.11.1.3.1]
      key: qnap.disk.temp[1]
      delay: 2m
      value_type: UNSIGNED
      units: °C
      tags:
      - tag: component
        value: temperature
      - tag: disk
        value: HDD1
      triggers:
      - uuid: 0ab6ccb0d16249e4be238068e81292de
        expression: last(/QNAP TS-869 Pro by SNMP/qnap.disk.temp[1])>={$QNAP.DISK.TEMP.WARN} and last(/QNAP TS-869 Pro by
          SNMP/qnap.disk.temp[1])>0
        name: 'QNAP: HDD1 temperature is high'
        event_name: 'QNAP: HDD1 temperature is {ITEM.LASTVALUE}'
        priority: WARNING
        description: Disk temperature exceeds the configured warning threshold. A value of 0 is ignored so an empty bay does
          not alert.
